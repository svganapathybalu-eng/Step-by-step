    waiting:function(label){setGo(label,false,null)},
    checkable:function(fn){setGo("Check",false,function(){if(!locked)fn()})},
    ready:function(on){if(!locked&&go.textContent==="Check")go.disabled=!on},
    result:function(ok,node){
      if(locked)return;locked=true;
      if(!item.retry){P.count++;if(ok)P.right++;else P.queue.push({s:s,retry:true})}
      cnt.textContent=(P.i+1)+" / "+P.queue.length;
      fbBox.append(node);api.next();go.focus({preventScroll:true});node.scrollIntoView({block:"nearest"});
    }
  };
  R[s.t](card,s,api,ctx);P.key=ctx.key;
}
function advance(){P.i++;if(P.i>=P.queue.length)finish();else{renderStep();window.scrollTo(0,0)}}
document.addEventListener("keydown",function(e){
  if(!P||!P.key)return;var t=e.target.tagName;if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA")return;
  if(e.key>="1"&&e.key<="9"){P.key(Number(e.key))}
});
function finish(){
  var L=P.lesson,box=$("#player"),mix=P.meta.mix;box.replaceChildren();
  var pct=P.count?Math.round(100*P.right/P.count):100,stars=pct>=90?3:pct>=70?2:1;
  if(!mix){var prev=S.done[L.id];S.done[L.id]={pct:Math.max(prev?prev.pct:0,pct),stars:Math.max(prev?prev.stars:0,stars)};S.last=L.id;save()}
  var msg=pct>=90?"Excellent. You understand this well.":pct>=70?"Good work. Read the key points below, then try again for three stars.":"You finished it. Do it once more. The second time is much easier.";
  box.append(h("span",{class:"label"},mix?"Revision finished":"Lesson finished"),
    h("p",{class:"score"},P.count?P.right+" / "+P.count:"Done"),
    h("p",{class:"stars","aria-label":stars+" out of 3 stars"},"★★★".slice(0,stars)+"☆☆☆".slice(0,3-stars)),
    h("p",null,msg));
  if(P.count)box.append(h("p",{class:"note"},"Score counts your first try on each question. Questions you missed came back once more."));
  if(L.sum&&L.sum.length){var u=h("ul");L.sum.forEach(function(x){u.append(HT(h("li"),x))});box.append(h("div",{class:"remember"},h("span",{class:"label"},"Key points to remember"),u))}
  var row=h("div",{class:"btnrow"});
  if(mix)row.append(h("button",{class:"btn",type:"button",on:{click:function(){startRevise()}}},"Another round"));
  else{
    var nx=ALL[BYID[L.id].n];
    if(nx)row.append(h("button",{class:"btn",type:"button",on:{click:function(){startLesson(nx.l.id)}}},"Next: "+nx.l.title));
    row.append(h("button",{class:"btn ghost",type:"button",on:{click:function(){startLesson(L.id)}}},"Do this lesson again"));
  }
  row.append(h("button",{class:"btn ghost",type:"button",on:{click:closePlayer}},"Back to course"));
  box.append(row);window.scrollTo(0,0);
}
function startLesson(id){var x=BYID[id];if(x)openPlayer(x.l,x.l.steps)}

/* ---- course map ---- */
function stars(n){return "★★★".slice(0,n)}
function renderHome(){
  var box=$("#home");box.replaceChildren();
  var done=ALL.filter(function(x){return S.done[x.l.id]}).length;
  var next=ALL.filter(function(x){return !S.done[x.l.id]})[0];
  var segs=h("div",{class:"segs"});
  COURSE.forEach(function(m,mi){var d=m.lessons.filter(function(l){return S.done[l.id]}).length;
    segs.append(h("div",{class:"seg",style:"flex:"+m.lessons.length+";--c:var(--m"+(mi+1)+")"},h("i",{style:"width:"+Math.round(100*d/m.lessons.length)+"%"})))});
  var ov=h("div",{class:"overall"},
    h("span",{class:"label"},"Your progress"),
    h("p",{style:"margin:0"},done?("You have finished "+done+" of "+ALL.length+" lessons."):("New here? Start with lesson 1 and go in order. Each lesson takes about 10 to 15 minutes.")),
    segs);
  if(next)ov.append(h("div",{class:"btnrow",style:"margin-top:0"},h("button",{class:"btn",type:"button",on:{click:function(){startLesson(next.l.id)}}},(done?"Continue: ":"Start: ")+next.l.title)));
  else ov.append(h("p",null,"You finished every lesson. Use Revise to keep your English sharp."));
  box.append(ov);
  COURSE.forEach(function(m,mi){
    var sec=h("div",{class:"mod",style:"--c:var(--m"+(mi+1)+")"},h("h2",null,m.title),h("p",null,m.blurb));
    m.lessons.forEach(function(l){
      var x=BYID[l.id],d=S.done[l.id];
      sec.append(h("button",{type:"button",class:"lrow"+(d?" done":""),style:"--c:var(--m"+(mi+1)+")",on:{click:function(){startLesson(l.id)}}},
        h("span",{class:"num"},String(x.n)),
        h("span",{class:"lt"},h("b",null,l.title),h("span",null,l.sub)),
        h("span",{class:"st2"},d?stars(d.stars)+" "+d.pct+"%":"Start")));
    });
    box.append(sec);
  });
  var rb=h("button",{class:"btn ghost sm",type:"button"},"Erase my progress"),armed=false,timer;
  rb.addEventListener("click",function(){
    if(!armed){armed=true;rb.textContent="Tap again to erase everything";timer=setTimeout(function(){armed=false;rb.textContent="Erase my progress"},4000)}
    else{clearTimeout(timer);S=fresh();save();refreshAll()}
  });
  box.append(h("p",{class:"note"},"Your progress is saved in this browser only."),rb);
}

/* ---- revision mix ---- */
var PRACTICE={mcq:1,build:1,type:1,find:1,sort:1,match:1};
var rv={scope:"done",n:10};
function revisePool(){
  var steps=[];ALL.forEach(function(x){if(rv.scope==="all"||S.done[x.l.id])x.l.steps.forEach(function(s){if(PRACTICE[s.t])steps.push(s)})});return steps;
}
function startRevise(){
  var pool=revisePool();if(!pool.length)return;
  openPlayer({id:"mix",title:"Mixed revision",sum:[]},shuffle(pool).slice(0,rv.n),{mix:true});
}
function pills(label,items,cur,set){
  var row=h("div",{class:"pills",role:"group","aria-label":label});
  items.forEach(function(it){row.append(h("button",{type:"button",class:"pill","aria-pressed":String(cur===it[0]),on:{click:function(){set(it[0]);renderRevise()}}},it[1]))});return row;
}
function renderRevise(){
  var box=$("#revise");box.replaceChildren();
  var pool=revisePool(),doneN=ALL.filter(function(x){return S.done[x.l.id]}).length;
  box.append(HT(h("p"),"Questions from your lessons, mixed up in a new order every time. Missed questions come back once more. This is the fastest way to remember."),
    h("span",{class:"label"},"Questions from"),
    pills("Questions from",[["done","Lessons I finished ("+doneN+")"],["all","All lessons"]],rv.scope,function(v){rv.scope=v}),
    h("span",{class:"label"},"Questions in a round"),
    pills("Questions in a round",[[10,"10"],[15,"15"],[20,"20"]],rv.n,function(v){rv.n=v}));
  if(pool.length)box.append(h("button",{class:"btn",type:"button",on:{click:startRevise}},"Start revision"),h("p",{class:"note",style:"margin-top:10px"},pool.length+" questions to choose from."));
  else box.append(h("div",{class:"empty"},h("p",null,"Finish your first lesson, then your revision questions appear here. Or choose All lessons."),h("button",{class:"btn ghost sm",type:"button",on:{click:function(){rv.scope="all";renderRevise()}}},"Use all lessons")));
}

/* ---- notes ---- */
function renderNotes(){
  var box=$("#notes");box.replaceChildren();
  var inp=h("input",{type:"search",class:"field",placeholder:"Search the notes (for example: modal, since, plural)","aria-label":"Search the notes"});
  var list=h("div"),items=[];
  COURSE.forEach(function(m,mi){
    list.append(h("h2",{style:"font-size:1.25rem;margin:18px 0 8px;color:var(--m"+(mi+1)+")"},m.title));
    m.lessons.forEach(function(l){
      var x=BYID[l.id],ul=h("ul");(l.sum||[]).forEach(function(t){ul.append(HT(h("li"),t))});
      var d=h("details",{class:"nd"},h("summary",null,x.n+". "+l.title),h("div",{class:"nb"},ul,h("button",{class:"btn ghost sm",type:"button",on:{click:function(){startLesson(l.id)}}},"Open lesson")));
      items.push({d:d,txt:(l.title+" "+l.sub+" "+(l.sum||[]).join(" ")).toLowerCase().replace(/<[^>]+>/g,"")});list.append(d);
    });
  });
  inp.addEventListener("input",function(){var q=inp.value.trim().toLowerCase();items.forEach(function(it){var m=!q||it.txt.indexOf(q)>-1;it.d.hidden=!m;it.d.open=!!q&&m})});
  box.append(inp,list);
}

/* ---- tabs ---- */
var TABS=["home","revise","notes"];
function showTab(n){TABS.forEach(function(k){$("#"+k).hidden=k!==n;$("#t-"+k).setAttribute("aria-selected",String(k===n))})}
TABS.forEach(function(n){$("#t-"+n).addEventListener("click",function(){showTab(n)})});
function refreshAll(){renderHome();renderRevise();renderNotes()}
refreshAll();
})();
</script>

</body></html>
