<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English Step by Step</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column. Course map (five coloured modules) -> lesson player (one idea per screen, sticky Continue bar) -> notes and revision. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--ink:#14213D;--muted:#566480;--line:#D6DDE9;
  --good:#17784B;--good-bg:#E2F4EA;--bad:#B3261E;--bad-bg:#FCEAE8;--focus:#1B5BC9;
  --m1:#1B5BC9;--m2:#0B7A6B;--m3:#A4501A;--m4:#B0284E;--m5:#4F6B10;
  --sb-bg:#D9E6FB;--vb-bg:#FDE0CC;--ob-bg:#D5F0E4;--ad-bg:#E8DAFA;--tm-bg:#FFEFB3;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1526;--surface:#162038;--ink:#E8EDF7;--muted:#98A5C2;--line:#2A3857;
  --good:#5ED39C;--good-bg:#12372A;--bad:#FF8F85;--bad-bg:#3E1F22;--focus:#74A8FF;
  --m1:#74A8FF;--m2:#4FD0BA;--m3:#EE9A60;--m4:#FF8FA8;--m5:#B5D865;
  --sb-bg:#22407A;--vb-bg:#6E3814;--ob-bg:#17503D;--ad-bg:#472C74;--tm-bg:#5E4D10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1526;--surface:#162038;--ink:#E8EDF7;--muted:#98A5C2;--line:#2A3857;
  --good:#5ED39C;--good-bg:#12372A;--bad:#FF8F85;--bad-bg:#3E1F22;--focus:#74A8FF;
  --m1:#74A8FF;--m2:#4FD0BA;--m3:#EE9A60;--m4:#FF8FA8;--m5:#B5D865;
  --sb-bg:#22407A;--vb-bg:#6E3814;--ob-bg:#17503D;--ad-bg:#472C74;--tm-bg:#5E4D10;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--body);padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(2.1rem,8vw,3.1rem);line-height:1.02;letter-spacing:-.02em}
.lede{margin:10px 0 0;color:var(--muted);max-width:34em}
p{margin:0 0 12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.label,.qlabel{font:500 .74rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 8px}
.note{color:var(--muted);font-size:.93rem}

/* word-job colours used inside lessons */
sb,vb,ob,ad,tm,hl{border-radius:4px;padding:1px 5px;font-weight:700;white-space:normal}
sb{background:var(--sb-bg)}vb{background:var(--vb-bg)}ob{background:var(--ob-bg)}ad{background:var(--ad-bg)}tm,hl{background:var(--tm-bg)}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:22px 0 22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;font:700 1rem var(--body);color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 22px;font:700 1.05rem var(--body);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* course map */
.overall{margin:0 0 24px}
.segs{display:flex;gap:4px;margin:8px 0 14px}
.seg{height:12px;background:var(--line);border-radius:3px;overflow:hidden;min-width:0}
.seg>i{display:block;height:100%;background:var(--c)}
.mod{margin:0 0 30px}
.mod>h2{font-size:1.45rem;color:var(--c);border-top:6px solid var(--c);padding-top:8px}
.mod>p{color:var(--muted);margin:2px 0 12px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;font:inherit;cursor:pointer}
.lrow:hover{border-color:var(--ink)}
.lrow .num{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font:500 .85rem var(--mono);color:var(--c)}
.lrow.done .num{background:var(--c);color:var(--bg)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-family:var(--display);font-size:1.05rem}
.lrow .lt span{color:var(--muted);font-size:.9rem;line-height:1.3;display:block}
.lrow .st2{flex:none;font:500 .78rem var(--mono);color:var(--muted);text-align:right}

/* player */
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ptitle{flex:1;min-width:0;font:700 .98rem var(--display);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcount{font:500 .85rem var(--mono);color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.meter>i{display:block;height:100%;background:var(--ink);border-radius:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin-bottom:16px}
.st{font-size:1.45rem;line-height:1.2;margin:0 0 14px}
.card ul{margin:0 0 14px;padding-left:1.2em}
.card li{margin:0 0 6px}
.q{font:600 clamp(1.3rem,5vw,1.65rem)/1.4 var(--display);margin:0 0 18px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.4em;text-align:center;border-bottom:3px solid var(--ink);padding:0 .2em;margin:0 .1em}
.blank.ok{color:var(--good);border-color:var(--good)}

.ex{margin:0 0 14px}
.exrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.listen{flex:none;appearance:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;margin-top:1px}
.listen:hover{border-color:var(--ink)}
.extext{min-width:0;flex:1}
.sent{font-size:1.12rem;line-height:1.7}
.exrow .note{margin-top:2px}
.tip{background:var(--tm-bg);border-radius:10px;padding:11px 14px;margin:0 0 14px}
.tip .label{color:var(--ink);margin-bottom:2px}
.tip p{margin:0}
.warn{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.wl{padding:9px 14px}
.wl.bad{background:var(--bad-bg)}.wl.good{background:var(--good-bg)}
.wl b{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;display:inline-block;min-width:4.4em}
.wl.bad b{color:var(--bad)}.wl.good b{color:var(--good)}
.warn .why{padding:8px 14px;color:var(--muted);font-size:.95rem}
.rules{margin:0 0 14px}
.rule{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .rl{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.rule .rf{font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.rule{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tl{margin:6px 0 16px;padding:6px 4px 0}
.tltrack{position:relative;height:30px}
.tltrack::before{content:"";position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)}
.tlseg{position:absolute;top:8px;height:14px;border-radius:7px;background:var(--m1)}
.tldot{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--m1)}
.tlnow{position:absolute;left:50%;top:0;height:30px;width:3px;margin-left:-1.5px;background:var(--ink)}
.tlpin{position:absolute;top:-2px;transform:translateX(-50%);font-size:.78rem;white-space:nowrap;color:var(--muted)}
.tl.two .tltrack{margin-top:22px}
.tllab{display:grid;grid-template-columns:1fr 1fr 1fr;font:500 .72rem var(--mono);letter-spacing:.1em;color:var(--muted)}
.tllab span:nth-child(2){text-align:center}.tllab span:nth-child(3){text-align:right}
.tlnote{margin:6px 0 0;font-size:.95rem}

.rgrid{display:grid;gap:8px;margin:0 0 10px}
.rcard{appearance:none;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 14px;font:700 1.05rem var(--body);cursor:pointer}
.rcard.open{border-color:var(--ink)}
.rbody{padding:10px 14px 4px}

.opts{display:grid;gap:10px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:700 1.08rem var(--body);cursor:pointer;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt .key{flex:none;width:28px;height:28px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font:500 .85rem var(--mono);color:var(--muted)}
.opt .otext{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .mark{flex:none;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.opt.correct{border-color:var(--good);background:var(--good-bg)}.opt.correct .mark{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.55}.opt.locked{pointer-events:none}
.inp{width:100%;font:600 1.2rem var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.slots,.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:10px}
.slots{min-height:58px;border:2px dashed var(--line);margin-bottom:12px;background:var(--bg)}
.tile{appearance:none;font:700 1.05rem var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.tile.ghost{visibility:hidden;border-color:transparent}
.tile.right{border-color:var(--good);background:var(--good-bg)}
.tok{appearance:none;font:inherit;font-size:1.15rem;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:8px;padding:3px 8px;margin:0 2px 6px 0;cursor:pointer}
.tok.on{border-color:var(--ink);background:var(--tm-bg)}
.tok.right{border-color:var(--good);background:var(--good-bg)}
.tok.bad{border-color:var(--bad);background:var(--bad-bg)}
.toks{margin:0 0 14px;line-height:2.1}
.srows{display:grid;gap:10px;margin:0 0 14px}
.srow{border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.srow.right{border-color:var(--good);background:var(--good-bg)}.srow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.sit{display:block;font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
.sbtns{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{appearance:none;font:700 .92rem var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.sbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srow .fixnote{display:block;margin-top:6px;font-size:.9rem}
.mcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 14px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{appearance:none;font:700 1rem var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 10px;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--ink);background:var(--tm-bg)}
.mbtn.matched{border-color:var(--good);background:var(--good-bg);pointer-events:none}
.mbtn.shake{border-color:var(--bad);background:var(--bad-bg)}

.fb{border-radius:12px;padding:14px 16px 4px;margin:0 0 16px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fhead{font:800 1.2rem var(--display);margin:0 0 8px}
.fb p{margin:0 0 10px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px}
.bar .btn{width:100%}

.score{font:800 clamp(3rem,16vw,5rem)/1 var(--display);margin:4px 0 6px}
.stars{font-size:1.8rem;letter-spacing:.15em;color:var(--m3);margin:0 0 8px}
.remember{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 4px;margin:16px 0}
.remember ul{margin:0 0 10px;padding-left:1.2em}.remember li{margin:0 0 6px}

.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.pill{appearance:none;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font:700 .95rem var(--body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nd{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
.nd summary{cursor:pointer;padding:12px 14px;font:700 1.02rem var(--display)}
.nd .nb{padding:0 14px 8px}.nd ul{margin:0 0 8px;padding-left:1.2em}.nd li{margin:0 0 6px}
.empty{background:var(--surface);border:1px dashed var(--muted);border-radius:12px;padding:16px;margin:0 0 16px}
@media (prefers-reduced-motion:no-preference){.meter>i,.seg>i{transition:width .3s}}
</style>

<div class="wrap">
  <div id="shell">
    <header>
      <h1>English Step by Step</h1>
      <p class="lede">Learn English basics on your own. Each lesson explains one idea in simple words, shows examples, and lets you practise at once.</p>
    </header>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="t-home" aria-controls="home" aria-selected="true" type="button">Course</button>
      <button class="tab" role="tab" id="t-revise" aria-controls="revise" aria-selected="false" type="button">Revise</button>
      <button class="tab" role="tab" id="t-notes" aria-controls="notes" aria-selected="false" type="button">Notes</button>
    </div>
    <main>
      <section id="home" role="tabpanel" aria-labelledby="t-home"></section>
      <section id="revise" role="tabpanel" aria-labelledby="t-revise" hidden></section>
      <section id="notes" role="tabpanel" aria-labelledby="t-notes" hidden></section>
    </main>
  </div>
  <section id="player" hidden></section>
</div>

<script>
/* ---- helpers the lesson files use ---- */
var COURSE=[];
var H={
  MOD:function(id,title,blurb,lessons){COURSE.push({id:id,title:title,blurb:blurb,lessons:lessons})},
  L:function(id,title,sub,steps,sum){return {id:id,title:title,sub:sub,steps:steps,sum:sum||[]}},
  learn:function(title){return {t:"learn",title:title,b:[].slice.call(arguments,1)}},
  mcq:function(q,o,a,e,x){return {t:"mcq",q:q,o:o,a:a,e:e,x:x}},
  build:function(s,e,extra,q){return {t:"build",s:s,e:e,extra:extra||[],q:q}},
  type:function(q,a,e,h){return {t:"type",q:q,a:[].concat(a),e:e,h:h}},
  find:function(q,s,e){return {t:"find",q:q,s:s,e:e}},
  sort:function(q,c,i,e){return {t:"sort",q:q,c:c,i:i,e:e}},
  match:function(q,p,e){return {t:"match",q:q,p:p,e:e}},
  reveal:function(title,intro,i){return {t:"reveal",title:title,intro:intro,i:i}}
};
</script>
<script>
with(H){

MOD("m1","1. Building blocks","The kinds of words, and how each one works.",[

L("parts","Words have jobs","The 8 kinds of words",[
 learn("Every word has a job",
  "Think of a sentence like a cricket team. Every player has a job. In the same way, every word in English has a job. There are <b>8 kinds of words</b>. They are called <b>parts of speech</b>.",
  ["ex","<sb>Ravi</sb> <vb>drinks</vb> <ad>hot</ad> <ob>tea</ob>.|Ravi = a name · drinks = an action · hot = describes the tea · tea = a thing"],
  "In this course, colours show the job: <sb>blue</sb> = who does it, <vb>orange</vb> = the action, <ob>green</ob> = the thing, <ad>purple</ad> = extra describing word, <tm>yellow</tm> = time or key word.",
  "Next, tap each card to meet the 8 jobs."),
 reveal("Meet the 8 jobs","Tap each card to open it.",[
  ["1. Noun","Names a person, place or thing. <i>teacher, Madurai, laptop, honesty</i>"],
  ["2. Pronoun","Takes the place of a noun, so we do not repeat it. <i>he, she, it, they, we</i>"],
  ["3. Verb","Shows an action or a state. <i>run, write, is, have</i>"],
  ["4. Adjective","Describes a noun. <i>big, red, honest</i>"],
  ["5. Adverb","Tells how, when or where something happens. <i>quickly, today, here</i>"],
  ["6. Preposition","Shows place, time or direction. <i>in, on, at, to, from</i>"],
  ["7. Conjunction","Joins words or sentences. <i>and, but, because, or</i>"],
  ["8. Interjection","A short word for a feeling. <i>Wow! Oh! Oops!</i>"]]),
 find("Tap the verb (the action word).","Priya [writes] a report every day.","“Writes” is the action, so it is the verb."),
 find("Tap the two nouns.","The [manager] sent an [email].","“Manager” is a person and “email” is a thing. Both are nouns."),
 sort("What job does each word do?",["Noun","Verb","Adjective"],[["teacher",0],["write",1],["happy",2],["laptop",0],["run",1],["small",2],["Chennai",0],["speak",1]],"Nouns name things, verbs show actions, adjectives describe."),
 mcq("In “She walks slowly.” what job does “slowly” do?",["Noun","Adverb","Adjective"],1,"“Slowly” tells <b>how</b> she walks. Words that tell how, when or where something happens are adverbs."),
 mcq("Which word is a preposition? “The keys are on the table.”",["keys","are","on","table"],2,"“On” shows where the keys are. Words like in, on, at, under are prepositions."),
 match("Match each word to its job.",[["and","Conjunction"],["Wow!","Interjection"],["they","Pronoun"],["quickly","Adverb"]],"Conjunction joins, interjection shows feeling, pronoun replaces a noun, adverb tells how.")
],["<b>Noun</b> names a person, place or thing.","<b>Pronoun</b> replaces a noun (he, she, they).","<b>Verb</b> shows an action or state.","<b>Adjective</b> describes a noun. <b>Adverb</b> tells how, when, where.","<b>Preposition</b> shows place or time. <b>Conjunction</b> joins. <b>Interjection</b> shows feeling."]),

L("nouns","Nouns and plurals","One thing or many things",[
 learn("What is a noun?",
  "A <b>noun</b> is a word for a person, a place, a thing or an idea.",
  ["table",["Type","Examples"],["Person","teacher, mother, Ravi"],["Place","office, Madurai, India"],["Thing","laptop, phone, tea"],["Idea (you cannot touch it)","happiness, honesty, time"]],
  "Names of people and places start with a <b>capital letter</b>: Ravi, Madurai, India. These are <b>proper nouns</b>. Other nouns, like teacher or city, are <b>common nouns</b>."),
 learn("One or many? Making plurals",
  "Most nouns just add <b>-s</b> for “many”. Some have special rules.",
  ["table",["Rule","One → Many"],["Most nouns: add -s","book → books · laptop → laptops"],["Ends in s, x, ch, sh: add -es","bus → buses · box → boxes · watch → watches · dish → dishes"],["Consonant + y: change y to -ies","city → cities · story → stories"],["Vowel + y: just add -s","day → days · key → keys"],["Ends in f or fe: change to -ves","leaf → leaves · knife → knives"],["Irregular: no rule, just learn","man → men · woman → women · child → children · foot → feet · person → people"]],
  ["tip","Some words never change: <i>sheep, fish</i>. And some words are never plural: <i>information, advice</i> (you will learn these later)."]),

MOD("m2","2. Sentence structure","How English sentences are built, from simple to joined.",[

L("svo","Subject, verb, object","The most important rule",[

  ["rules",["Order","<sb>Subject</sb> + <vb>Verb</vb> + <ob>Object</ob>"]],
  ["ex","<sb>Priya</sb> <vb>reads</vb> <ob>books</ob>.|who + does + what","<sb>The students</sb> <vb>wrote</vb> <ob>a test</ob>.|who + does + what"],
  ["warn","Priya books reads.","Priya reads books.","The verb comes in the middle, after the subject."]),
 learn("What are they?",
  ["list","<b>Subject</b> = who or what does the action.","<b>Verb</b> = the action.","<b>Object</b> = who or what receives the action."],
  "Some verbs need no object: <i>She sleeps. The baby cried.</i>",
  "Extra information (how, where, when) goes <b>after</b> the object. A simple order is <b>how → where → when</b>.",
  ["ex","<sb>I</sb> <vb>study</vb> <ob>English</ob> <tm>every evening</tm>.|time goes at the end","<sb>We</sb> <vb>met</vb> <ob>the client</ob> <tm>at the office yesterday</tm>.|place, then time"]),
 build("The manager sent an email.","Subject, then verb, then object."),
 build("We study English every evening.","Time goes at the end."),
 build("Ravi drinks tea in the morning.","Subject, verb, object, then time."),
 find("Tap the subject.","[The new trainer] teaches grammar.","The subject is who does the action: the new trainer."),
 find("Tap the object.","Priya wrote [a long report].","The object is what was written: a long report."),
 mcq("Which order is correct?",["Reads Priya books.","Priya reads books.","Priya books reads."],1,"Subject (Priya) → verb (reads) → object (books)."),
 sort("What job does each part do?",["Subject","Verb","Object"],[["The trainer",0],["explains",1],["the lesson",2],["Meena",0],["is writing",1],["an email",2]],"Subject = who. Verb = action. Object = what.")
],["English order: <b>Subject + Verb + Object</b>.","The verb comes in the middle, not at the end.","How, where, when go after the object. Time usually goes last."]),

  ["ex","I <vb>was</vb> late yesterday.|past of am","They <vb>were</vb> at home.|past of are"],
  "<b>Negative:</b> add <b>not</b>: <i>She is not ready.</i> <b>Question:</b> put <b>be</b> first: <i>Is she ready? Where were they?</i>"),

L("join","Joining sentences","and, but, so, because, although",[

  ["warn","Because I was ill, so I stayed home.","Because I was ill, I stayed home. (or: I was ill, so I stayed home.)","Use <b>because</b> OR <b>so</b>. Never both in one sentence."]),
 learn("Simple, compound, complex",
  ["list","<b>Simple</b>: one idea. <i>I study.</i>","<b>Compound</b>: two ideas joined by and / but / or / so. <i>I study, and she works.</i>","<b>Complex</b>: one main idea and one that depends on it (because, although, when, if). <i>I study because I want a good job.</i>"],

],["<b>and</b> adds · <b>but</b> and <b>although</b> show a difference · <b>so</b> shows a result · <b>because</b> shows a reason.","Never use because and so together.","Never use although and but together.","Comma before and / but / so between two full sentences."])

<script>
with(H){

MOD("m3","3. Helping verbs and modals","Small verbs that make questions, negatives, tenses and polite English.",[

L("help","Helping verbs","be, do, have",[
 learn("Helping verbs help the main verb",
  "A <b>helping verb</b> (also called an auxiliary verb) stands in front of the <b>main verb</b>. It does not carry the main meaning. It helps to make tenses, questions and negatives.",
  ["ex","She <vb>is</vb> <ad>working</ad>.|is = helper · working = main verb","<vb>Do</vb> you <ad>like</ad> tea?|do = helper · like = main verb","They <vb>have</vb> <ad>finished</ad>.|have = helper · finished = main verb"],
  "<vb>Orange</vb> = helping verb. <ad>Purple</ad> = main verb."),
 learn("The three big helpers",
  ["table",["Helper","Forms","It helps to make"],["be","am, is, are, was, were","continuous tenses (is working) and passive"],["do","do, does, did","questions and negatives (Do you know? I don't know.)"],["have","have, has, had","perfect tenses (has finished)"]],
  "These three can also be <b>main verbs</b>: <i>She has a car. I do my homework. He is a teacher.</i> If there is no other verb, it is the main verb."),
 reveal("What each helper does","Tap to see an example.",[
  ["be + V-ing","An action in progress: <i>I am reading.</i>"],
  ["be + V3","The passive: <i>The mail was sent.</i>"],
  ["do / does / did","Questions and negatives: <i>Does she know? She did not know.</i>"],
  ["have / has / had + V3","Perfect tenses: <i>I have finished.</i>"],
  ["will, can, should ...","Modal verbs. You will learn them in the next lessons."]]),
 find("Tap the helping verb.","She [is] cooking dinner.","“Is” helps the main verb “cooking”."),
 find("Tap the helping verb.","They [have] already left.","“Have” helps the main verb “left”."),
 find("Tap the helping verb.","[Did] you call him?","“Did” helps the main verb “call”."),
 mcq("In “He has a car.” the word “has” is ...",["a helping verb","the main verb"],1,"There is no other verb. “Has” means “owns”, so it is the main verb."),
 mcq("In “He has finished.” the word “has” is ...",["a helping verb","the main verb"],0,"The main verb is “finished”. “Has” helps it."),
 mcq("She ___ working now.",["do","is","has"],1,"Working = V-ing, so we need be: is."),
 mcq("___ you know the answer?",["Do","Are","Have"],0,"Present simple question: Do you know ...?")
],["Helping verbs: <b>be, do, have</b> and the modals.","<b>be</b> + V-ing = continuous · <b>have</b> + V3 = perfect · <b>do / does / did</b> = questions and negatives.","If there is no other verb, be / do / have is the main verb."]),

L("modal1","Modal verbs: can and could","Ability, permission, requests",[
 learn("What are modal verbs?",
  "<b>Modal verbs</b> are special helping verbs. They add a feeling to the sentence: ability, permission, advice, possibility or duty.",
  ["list","The modals: <b>can, could, may, might, will, would, shall, should, must</b>."],
  "Three golden rules. They are always the same:",
  ["rules",["Rule 1","he / she / it takes <b>no -s</b>: <i>She can swim.</i>"],["Rule 2","Use the <b>plain verb</b> (V1) after a modal: <i>She can swim.</i>"],["Rule 3","Question: modal first. Negative: add not. <i>Can she swim? She cannot swim.</i>"]],
  ["warn","She can swims.","She can swim.","After a modal, the verb stays plain. No -s, no -ed, no to."],
  ["warn","He can to drive.","He can drive.","Do not put “to” after can."]),
 learn("can: ability, permission, request",
  ["table",["Use","Example"],["ability","I can type fast."],["permission (friendly)","Can I open the window?"],["request","Can you help me?"],["possibility","It can get very hot in May."]],
  "<b>can't / cannot</b> = not able, or not allowed. <b>could</b> = past ability (<i>I could swim when I was six</i>) and a more polite request (<i>Could you help me, please?</i>)."),
 mcq("She ___ speak three languages.",["can","cans","can to"],0,"Modal + plain verb. No -s, no to."),
 mcq("When I was a child, I ___ climb trees.",["can","could","will"],1,"Past ability: could."),
 mcq("Which request is more polite?",["Can you open the door?","Could you open the door, please?"],1,"“Could” is more polite than “can”."),
 mcq("He ___ drive a car. He is only ten.",["can","can't","could"],1,"He is ten, so he is not able: can't."),
 mcq("Choose the correct sentence.",["Can she sings?","Can she sing?","Can she to sing?"],1,"Can + subject + plain verb."),
 type("Make a question: “You can help me.” → ___ you help me?","Can","The modal goes first: Can you help me?"),
 build("Could you send me the file?","Modal first, then the subject, then the plain verb.")
],["Modals: no -s, then <b>plain verb</b>, no to.","<b>can</b> = ability, permission. <b>could</b> = past ability, polite request.","Question: modal first. Negative: modal + not."]),

L("modal2","will, would and shall","Future, polite offers and requests",[
 learn("will",
  "<b>will</b> is used for the future: decisions made now, promises, offers and predictions. (You will learn it again in the tenses.)",
  ["ex","I <vb>will</vb> call you tomorrow.|promise","It <vb>will</vb> rain today.|prediction","<vb>Will</vb> you help me?|request"],
  "Short form: I'll, she'll. Negative: <b>won't</b> (= will not)."),
 learn("would: polite and imagined",
  ["list","Polite offer: <i>Would you like some tea?</i>","Polite request: <i>Would you please close the door?</i>","Imagined situation: <i>If I had time, I would learn French.</i>","Past habit: <i>When I was a child, we would play outside every evening.</i>"],
  ["tip","<b>Would you like ...?</b> is more polite than <b>Do you want ...?</b>"]),
 learn("shall",
  "<b>shall</b> is used with <b>I</b> and <b>we</b> to make an offer or a suggestion: <i>Shall I open the window? Shall we start?</i>",
  "In daily English, many people use <i>Let's</i> or <i>Should we</i> instead. You mainly need shall in these two question forms."),
 mcq("The phone is ringing. I ___ answer it.",["will","would","shall"],0,"A quick decision made now: will."),
 mcq("___ you like some tea? (polite offer)",["Do","Would","Will"],1,"“Would you like” is the polite way to offer."),
 mcq("It's hot here. ___ I open the window? (offer)",["Shall","Would","Must"],0,"“Shall I ...?” offers to do something."),
 mcq("I promise I ___ be late again.",["won't","wouldn't","shan't"],0,"A promise about the future: won't."),
 mcq("Which is the most polite?",["Give me water.","Will you give me water?","Would you please give me some water?"],2,"“Would you please ...” is the most polite."),
 mcq("Which one is correct?",["She wills come tomorrow.","She will come tomorrow.","She will comes tomorrow."],1,"will + plain verb. Never add -s to will.")
],["<b>will</b> = decision now, promise, prediction. Negative: <b>won't</b>.","<b>Would you like ...?</b> = polite offer. <b>Would you please ...?</b> = polite request.","<b>Shall I / Shall we ...?</b> = offer or suggestion."]),

L("modal3","may and might","Possibility and polite permission",[
 learn("may and might: maybe",
  "<b>may</b> and <b>might</b> talk about <b>possibility</b>. It is possible, but we are not sure.",
  ["ex","It <vb>may</vb> rain this evening.|maybe it will","He <vb>might</vb> be late.|maybe, we are less sure"],
  "Both mean “maybe”. <b>might</b> is a little less sure than <b>may</b>. In daily English they are used almost the same.",
  ["warn","He may be comes.","He may come.","Modal + plain verb. Never -s or -ed."]),
 learn("may: polite permission",
  "<b>May I ...?</b> is a polite way to ask for permission: <i>May I come in? May I use your pen?</i> Answers: <i>Yes, you may. / I'm sorry, you may not.</i>",
  ["table",["Ask like this","How polite?"],["Can I use your pen?","friendly"],["Could I use your pen?","polite"],["May I use your pen?","very polite, formal"]],
  ["tip","<i>He may come</i> = maybe he will come. <i>He can come</i> = he is able or allowed to come."]),
 mcq("Take an umbrella. It ___ rain later.",["may","can","must"],0,"Possible, not sure: may."),
 mcq("___ I come in, sir? (very polite)",["May","Will","Do"],0,"“May I ...?” is the polite way to ask permission."),
 mcq("Meena is not in class. She ___ be sick. (maybe)",["might","shall","would"],0,"Maybe: might."),
 mcq("Which sentence means “maybe”?",["He may come.","He must come.","He shall come."],0,"May = maybe."),
 mcq("Choose the correct sentence.",["She might to go.","She might goes.","She might go."],2,"Modal + plain verb."),
 build("May I use your phone?","Modal first for a question.")
],["<b>may / might</b> = maybe. Modal + plain verb.","<b>May I ...?</b> = very polite permission.","Politeness: can (friendly) → could (polite) → may (formal)."]),

L("modal4","should, must, have to","Advice and duty",[
 learn("should: advice",
  "Use <b>should</b> to give advice, or to say what is a good idea.",
  ["ex","You <vb>should</vb> drink more water.|advice","You <vb>shouldn't</vb> skip breakfast.|negative advice","<vb>Should</vb> I take this job?|asking for advice"],
  "<b>ought to</b> means the same: <i>You ought to see a doctor.</i> <b>had better</b> is strong advice with a warning: <i>You had better hurry, or you will miss the train.</i>"),
 learn("must and have to: duty",
  "<b>must</b> = a strong duty that the speaker feels. <b>have to</b> = a duty from outside, like a rule or a schedule.",
  ["ex","I <vb>must</vb> finish this today.|I feel it is very important","You <vb>must</vb> wear an ID card.|a rule at the office","She <vb>has to</vb> wake up at 5 a.m.|her schedule makes her"],
  "<b>have to</b> changes with the subject: I have to, she has to, they had to (past). <b>must</b> has no past form. Use <b>had to</b>: <i>Yesterday I had to work late.</i>"),
 learn("Careful: mustn't or don't have to?",
  ["table",["Phrase","Meaning","Example"],["mustn't","it is forbidden: do NOT","You mustn't use your phone in the exam."],["don't have to","it is not necessary (you may, if you like)","You don't have to come on Sunday."]],
  ["tip","<b>mustn't</b> = don't do it! <b>don't have to</b> = there is no need."]),
 mcq("I have a headache. I think I ___ rest.",["should","mustn't","can"],0,"Giving advice: should."),
 mcq("You ___ smoke here. It is forbidden.",["mustn't","don't have to","shouldn't to"],0,"Forbidden: mustn't."),
 mcq("It is a holiday tomorrow. We ___ come to office.",["mustn't","don't have to","must"],1,"No need to come: don't have to."),
 mcq("Yesterday I ___ stay late to finish the report.",["must","had to","should"],1,"Past duty: had to. Must has no past."),
 mcq("She ___ get up early. Her class starts at 7.",["has to","have to","must to"],0,"She + schedule: has to."),
 mcq("Choose the correct sentence.",["He should goes now.","He should go now.","He should to go now."],1,"Modal + plain verb."),
 match("Match the word to its meaning.",[["should","a good idea"],["must","strong duty"],["mustn't","forbidden"],["don't have to","not necessary"]],"These four are the most confused pairs. Learn them well.")
],["<b>should / ought to</b> = advice.","<b>must</b> = strong duty. <b>have to</b> = rule or schedule. Past of both: <b>had to</b>.","<b>mustn't</b> = forbidden. <b>don't have to</b> = not necessary."]),

L("modal5","Modals in questions and the past","should have, could have, must have",[
 learn("Questions and negatives with modals",
  "<b>Modals never need do / does / did.</b> For a question, put the modal first. For a negative, add <b>not</b>.",
  ["table",["Statement","Question","Negative"],["She can swim.","Can she swim?","She can't swim."],["They should go.","Should they go?","They shouldn't go."],["You will come.","Will you come?","You won't come."],["He must leave.","Must he leave?","He mustn't leave."]],
  "Short answers: <i>Can she swim? Yes, she can. / No, she can't.</i>"),
 learn("Modals for the past",
  "To talk about the past, use <b>modal + have + V3</b>.",
  ["table",["Pattern","Meaning","Example"],["should have + V3","a good idea, but it did not happen","You should have called me."],["could have + V3","it was possible, but it did not happen","I could have gone, but I was busy."],["might have + V3","maybe it happened","She might have missed the bus."],["must have + V3","I am sure it happened","He must have forgotten."]],
  ["tip","<b>should have</b> = regret or blame. <b>must have</b> = a clever guess that you are almost sure about."]),
 mcq("Make a question: She can drive.",["Does she can drive?","Can she drive?","Can she drives?"],1,"Modal first. No does."),
 mcq("I'm sorry I was late. I ___ left earlier.",["should have","should","must"],0,"A past regret: should have + V3."),
 mcq("The lights are off. They ___ gone home.",["must have","must","should"],0,"A guess about the past: must have + V3."),
 mcq("He failed the test. He ___ studied more.",["should have","must","will"],0,"A past regret: should have + V3."),
 mcq("Choose the correct sentence.",["She should have came.","She should have come.","She should has come."],1,"Modal + have + V3. The V3 of come is come."),
 mcq("I'm not sure, but she ___ be in the library. (maybe)",["might","should have","has to"],0,"Maybe (now): might + plain verb.")
],["Modal question: <b>modal + subject + V1?</b> No do / does.","Past modals: <b>should / could / might / must + have + V3</b>.","<b>should have</b> = regret. <b>must have</b> = sure guess."])

]);

}

<script>
with(H){

L("tmap","The tense map","How all tenses fit together",[
 learn("Tenses tell us WHEN",
  "A <b>tense</b> shows <b>when</b> something happens: in the past, now or in the future. It also shows <b>how</b>: simple, continuous (in progress), perfect (before or connected to another time), or perfect continuous (a long action).",
  ["table",["","Past","Present","Future"],["<b>Simple</b>","I worked","I work","I will work"],["<b>Continuous</b>","I was working","I am working","I will be working"],["<b>Perfect</b>","I had worked","I have worked","I will have worked"],["<b>Perfect continuous</b>","I had been working","I have been working","I will have been working"]],
  "That is <b>12 tenses</b>. You will also learn <b>going to</b> for plans. Do not worry. We learn them one by one."),

  ["p","<b>Past simple</b>: finished at a past time."],["tl",20,20,"I worked yesterday."],
  ["p","<b>Present continuous</b>: happening around now."],["tl",42,58,"I am working now."],
  ["p","<b>Present perfect continuous</b>: started before, continues until now."],["tl",18,50,"I have been working for two hours."],
  ["p","<b>Future simple</b>: later."],["tl",82,82,"I will work tomorrow."]),

  ["tip","Each tense has its own lesson. Do them in order and keep the notes open."]),
 match("Match the tense to its sentence.",[["Past simple","I worked."],["Present continuous","I am working."],["Present perfect","I have worked."],["Future simple","I will work."]],"Look at the helper: no helper (V2), am + -ing, have + V3, will + V1."),

],["Tense = <b>when</b> (past, present, future) + <b>how</b> (simple, continuous, perfect, perfect continuous).","Simple = facts and finished actions. Continuous = in progress. Perfect = before or connected to another time.","Ask: When? What kind of action? Which signal words?"]),

L("ps","Present Simple","Habits and facts",[

  ["tl",8,92,"Again and again: past, now and future."],
  ["tip","Same every day? Use <b>Present Simple</b>."]),

  ["rules",["Positive","<sb>I / you / we / they</sb> + <vb>V1</vb> <i>They work.</i>"],["Positive","<sb>he / she / it</sb> + <vb>V1 + s</vb> <i>She works.</i>"],["Negative","<sb>S</sb> + <vb>do not / does not</vb> + V1 <i>She doesn't work.</i>"],["Question","<vb>Do / Does</vb> + <sb>S</sb> + V1? <i>Does she work?</i>"]],
  "Spelling of -s: watch → watches · study → studies · go → goes · have → has.",

 learn("Signal words",
  ["list","<b>How often</b>: always, usually, often, sometimes, rarely, never","<b>Time</b>: every day, every week, on Mondays, in the morning, once a week","<b>Position</b>: frequency words go <b>before</b> the main verb (<i>I always drink tea</i>) but <b>after</b> be (<i>She is always happy</i>)."]),
 mcq("My brother ___ in a bank.",["work","works","is working"],1,"A fact about his job, and “brother” = he. Add -s: works."),
 mcq("They ___ football on Sundays.",["plays","play","are playing"],1,"“On Sundays” = a habit. They + V1: play."),
 mcq("She ___ coffee. She only drinks tea.",["don't drink","doesn't drink","doesn't drinks"],1,"She + negative = doesn't + V1."),

 find("Tap the verb.","The train [leaves] at six every day.","A timetable uses the Present Simple."),
 sort("Habit or happening NOW?",["Habit (Present Simple)","Now (Present Continuous)"],[["I drink tea every day.",0],["I am drinking tea now.",1],["He plays cricket on Sundays.",0],["Look! It is raining.",1],["Water boils at 100°C.",0]],"“Every day” and facts are Present Simple. “Now” and “Look!” are Present Continuous.")
],["<b>Present Simple</b> = habits, facts, timetables.","he / she / it + <b>V1 + s</b>. Negative: <b>do not / does not</b> + V1. Question: <b>Do / Does</b> + S + V1?","After does, use V1 (no -s).","Signal words: always, usually, often, never, every day."]),

L("pc","Present Continuous","Happening now",[
 learn("Present Continuous: happening now",

  ["tl",42,58,"The action is in progress at this moment."],
  ["tip","Is the camera <b>ON</b> right now? Use Present Continuous."]),
 learn("Making the Present Continuous",
  ["rules",["Positive","<sb>S</sb> + <vb>am / is / are</vb> + <ad>V-ing</ad> <i>She is working.</i>"],["Negative","<sb>S</sb> + <vb>am / is / are not</vb> + <ad>V-ing</ad> <i>She isn't working.</i>"],["Question","<vb>Am / Is / Are</vb> + <sb>S</sb> + <ad>V-ing</ad>? <i>Is she working?</i>"]],
  "<b>I am</b> · <b>he / she / it is</b> · <b>we / you / they are</b>.",

  ["warn","I am having a car.","I have a car.","“Have” meaning “own” is a state verb. But <i>I am having lunch</i> is correct, because it is an action."]),
 mcq("Shh! The baby ___.",["sleeps","is sleeping","sleep"],1,"“Shh!” = now. Use am / is / are + -ing."),
 mcq("They ___ for the exam these days.",["are preparing","prepares","prepare"],0,"“These days” = temporary. They are + -ing."),

L("pp","Present Perfect","The past that touches now",[
 learn("Present Perfect: the past that touches now",
  "The <b>Present Perfect</b> talks about the past, but it is <b>connected to now</b>. We do <b>not</b> say when it happened.",
  ["ex","I <vb>have visited</vb> Madurai Meenakshi Temple.|life experience","I <vb>have lost</vb> my phone. I can't call you.|result now","She <vb>has worked</vb> here for two years.|started in the past, still true"],
  ["tl",18,50,"The action starts in the past and reaches NOW."],
  ["tip","<b>No finished time!</b> If you can say yesterday, last week or in 2019, use the Past Simple, not the Present Perfect."]),
 learn("Making the Present Perfect",
  ["rules",["Positive","<sb>S</sb> + <vb>have / has</vb> + <ad>V3</ad> <i>I have finished.</i>"],["Negative","<sb>S</sb> + <vb>have / has not</vb> + <ad>V3</ad> <i>She hasn't finished.</i>"],["Question","<vb>Have / Has</vb> + <sb>S</sb> + <ad>V3</ad>? <i>Have you finished?</i>"]],
  "<b>he / she / it</b> takes <b>has</b>. Everyone else takes <b>have</b>.",
  ["warn","I have went to Chennai.","I have gone to Chennai.","After have / has use V3 (gone), not V2 (went)."],
  ["table",["been","gone"],["He <b>has been to</b> Delhi. (He went and came back.)","He <b>has gone to</b> Delhi. (He is there now.)"]]),
 learn("Signal words: for, since, ever, never, yet, already, just",
  ["table",["Word","Meaning","Example"],["for","how long","for two years"],["since","the starting point","since 2022 · since Monday"],["ever / never","in your life so far","Have you ever ...? I have never ..."],["already","sooner than expected","I have already eaten."],["yet","until now (negatives and questions)","I haven't finished yet."],["just","a very short time ago","She has just left."]],
  ["warn","I have seen him yesterday.","I saw him yesterday.","“Yesterday” is a finished time, so use the Past Simple."]),
 mcq("I ___ here since 2022.",["work","have worked","am working"],1,"“Since 2022” starts in the past and continues now: Present Perfect."),
 mcq("She has lived in Madurai ___ ten years.",["since","for","from"],1,"A length of time: for."),
 mcq("She has lived in Madurai ___ 2015.",["since","for","from"],0,"A starting point: since."),
 mcq("___ you ever visited Chennai?",["Did","Have","Do"],1,"“Ever” = life experience. Have + you + V3."),
 mcq("He ___ the report yet.",["hasn't finished","didn't finished","doesn't finish"],0,"“Yet” goes with Present Perfect. He + hasn't + V3."),
 mcq("Which sentence is correct?",["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday."],1,"“Yesterday” needs the Past Simple."),
 type("Kumar has ___ the test twice. (take)","taken","take → took → taken. Use V3 after has.","Third form of take"),
 type("They have already ___ home. (go)","gone","go → went → gone. Use V3 after have.","Third form of go"),
 build("Have you finished the report yet?","Have + subject + V3."),
 build("I have never eaten sushi.","Never goes between have and V3."),
 sort("Present Perfect or Past Simple?",["Present Perfect","Past Simple"],[["I have visited Delhi.",0],["I visited Delhi in 2019.",1],["She has just left.",0],["She left an hour ago.",1],["We have known him for years.",0],["We met him last year.",1]],"A finished time (in 2019, an hour ago, last year) means Past Simple.")
],["<b>Present Perfect</b> = past connected to now. No finished time.","<b>have / has + V3</b>. He / she / it takes <b>has</b>.","<b>for</b> + length · <b>since</b> + starting point.","ever, never, already, yet, just = Present Perfect words.","yesterday, last week, ago, in 2019 = Past Simple."]),

  ["ex","I <vb>have been waiting</vb> for 30 minutes.|still waiting","She <vb>has been crying</vb>. Her eyes are red.|just stopped, you see the result","They <vb>have been playing</vb> since 4 p.m.|still playing"],
  ["tl",18,50,"A tap opened in the past that is still running."],
  ["tip","Still running? <b>have been + -ing</b>. It answers “How long?”"]),
 learn("Making it",
  ["rules",["Positive","<sb>S</sb> + <vb>have / has been</vb> + <ad>V-ing</ad> <i>I have been waiting.</i>"],["Negative","<sb>S</sb> + <vb>have / has not been</vb> + <ad>V-ing</ad> <i>I haven't been waiting.</i>"],["Question","<vb>Have / Has</vb> + <sb>S</sb> + <vb>been</vb> + <ad>V-ing</ad>? <i>Have you been waiting?</i>"]],
  "Compare:",
  ["ex","I <vb>have read</vb> three books.|Present Perfect: how many, the result","I <vb>have been reading</vb> all day.|Present Perfect Continuous: how long"]),
 learn("Signal words and warnings",
  ["list","<b>Signal words</b>: for, since, how long, all day, lately, recently"],
  ["warn","I am waiting since morning.","I have been waiting since morning.","“Since” and “for” with a period of time need a perfect tense."],
  "State verbs do not take the continuous: <i>I have known him for years</i> (not “been knowing”)."),
 mcq("I ___ for the Versant test for two months.",["prepare","am preparing","have been preparing"],2,"“For two months” + still going: have been + -ing."),
 mcq("How long ___ you been waiting?",["have","are","did"],0,"“Been waiting” needs have / has before it."),
 mcq("It ___ since morning.",["is raining","has been raining","rains"],1,"“Since morning” + still going: has been + -ing."),
 mcq("She has been ___ since 9 a.m.",["work","works","working"],2,"After been we use V-ing: working."),
 mcq("Choose the correct sentence.",["He is working here since 2020.","He has been working here since 2020.","He works here since 2020."],1,"“Since 2020” needs a perfect tense."),
 type("We have been ___ English for a year. (learn)","learning","have been + V-ing: learning."),
 build("How long have they been waiting?","Wh-word + have + subject + been + -ing."),
 build("She has not been sleeping well.","has not been + -ing."),
 find("Tap the verb phrase.","Ravi [has been working] on this project since January.","has been + working = Present Perfect Continuous."),
 mcq("Which sentence stresses HOW LONG? “I have read three books.” or “I have been reading all day.”",["The first one","The second one"],1,"The continuous form with “all day” shows how long.")
],["<b>have / has been + V-ing</b> = started before, still going, how long.","Use <b>for</b> (length) and <b>since</b> (start point).","State verbs (know, like) do not take the continuous.","Present Perfect = result or number. Perfect Continuous = how long."]),

  ["ex","We <vb>watched</vb> a movie yesterday.|finished time","He <vb>woke</vb> up, <vb>had</vb> tea and <vb>left</vb> for work.|one action after another","When I was young, I <vb>played</vb> cricket every day.|past habit"],

  ["tip","Finished time word (yesterday, last week, ago, in 2019)? Use <b>Past Simple</b>."]),

  "<b>be</b> in the past: <i>I was, you were, he was, we were.</i>",
  ["warn","Did you went there?","Did you go there?","After did, use V1. The past is already shown by “did”."],
  ["warn","I didn't saw him.","I didn't see him.","After didn't, use V1."],
  ["tip","How -ed sounds: <b>worked</b> = /t/ · <b>played</b> = /d/ · <b>wanted</b> = /id/."]),

  ["table",["V1","V2","V1","V2"],["go","went","buy","bought"],["see","saw","eat","ate"],["come","came","write","wrote"],["take","took","speak","spoke"],["make","made","tell","told"],["get","got","think","thought"],["give","gave","leave","left"],["have","had","meet","met"],["do","did","say","said"]],
  "Say three of these aloud every day. Soon they feel natural."),
 mcq("Last Sunday we ___ a movie.",["watch","watched","have watched"],1,"“Last Sunday” is a finished time: Past Simple."),
 mcq("She ___ to Chennai in 2019.",["moved","has moved","moves"],0,"“In 2019” is a finished time."),
 mcq("I ___ the meeting because I was sick.",["didn't attend","don't attend","didn't attended"],0,"Past negative: didn't + V1."),
 mcq("___ you finish the work last night?",["Do","Did","Have"],1,"“Last night” is past. Did + you + V1."),
 type("She ___ a new phone last week. (buy)","bought","buy → bought (irregular)."),
 type("We ___ lunch at one o'clock. (eat)","ate","eat → ate (irregular)."),

 build("Did you see the manager yesterday?","Did + subject + V1."),
 build("He did not come to the class.","did not + V1."),
 find("Tap the past verbs.","Ravi [woke] up, [had] tea and [left] for work.","woke, had and left are V2 (past) forms.")
],["<b>Past Simple</b> = finished action at a finished time.","Positive: <b>V2</b>. Negative: <b>did not + V1</b>. Question: <b>Did + S + V1?</b>","After did / didn't use V1.","Signal words: yesterday, last week, ago, in 2019, when I was young."]),

L("pasc","Past Continuous","In progress in the past",[
 learn("Past Continuous: in progress in the past",
  "Use the <b>Past Continuous</b> for an action that was <b>in progress</b> at a moment in the past, or that was <b>interrupted</b> by a shorter action.",
  ["ex","At 8 p.m. yesterday, I <vb>was studying</vb>.|in progress at that moment","I <vb>was walking</vb> home when I <vb>met</vb> my friend.|long action + short action","While she <vb>was cooking</vb>, he <vb>was watching</vb> TV.|two actions together"],
  ["tl",22,38,"The action was running at that past time."],
  ["tip","Think of a <b>film</b> and a <b>photo</b>. The film is running: <i>was walking</i>. The photo is one click: <i>met</i>."]),
 learn("Making the Past Continuous",
  ["rules",["Positive","<sb>S</sb> + <vb>was / were</vb> + <ad>V-ing</ad> <i>I was working.</i>"],["Negative","<sb>S</sb> + <vb>was / were not</vb> + <ad>V-ing</ad> <i>They weren't working.</i>"],["Question","<vb>Was / Were</vb> + <sb>S</sb> + <ad>V-ing</ad>? <i>Were you working?</i>"]],
  "<b>I / he / she / it</b> was · <b>we / you / they</b> were.",
  ["warn","They was playing cricket.","They were playing cricket.","“They” always takes were."],
  ["list","<b>Signal words</b>: while, when, as, at 8 p.m. yesterday, all evening.","<b>while</b> + a long action. <b>when</b> + a short action: <i>I was cooking when the power went off.</i>"]),
 mcq("At 8 p.m. yesterday, I ___ my presentation.",["prepared","was preparing","am preparing"],1,"One moment in the past, and the action was in progress."),
 mcq("The students ___ when the trainer walked in.",["talked","was talking","were talking"],2,"Long action, so Past Continuous. Students = they: were."),
 mcq("I ___ home when I met my old friend.",["was walking","walked","am walking"],0,"Long action (walking) + short action (met)."),
 mcq("While she ___ the report, he was making tea.",["wrote","was writing","writes"],1,"“While” + a long action."),
 mcq("What ___ you doing at 10 last night?",["were","was","did"],0,"You + past continuous: were."),
 type("It was ___ heavily when we left. (rain)","raining","was + V-ing: raining."),
 build("They were not sleeping at ten.","were not + -ing."),
 build("What were you doing at nine?","Wh-word + were + subject + -ing."),
 find("Tap the verb phrase for the long action.","I [was cooking] when the power went off.","was + cooking = the long action in progress."),
 sort("Which action was long, and which was short?",["Long (was / were + -ing)","Short (Past Simple)"],[["was sleeping",0],["rang (the phone)",1],["were talking",0],["walked in",1]],"The long action is the film. The short action is the photo.")
],["<b>Past Continuous</b> = in progress at a moment in the past.","<b>was / were + V-ing</b>.","Film = was / were + -ing. Photo = Past Simple.","while + long action. when + short action."]),

L("pap","Past Perfect","The earlier past",[
 learn("Past Perfect: the earlier past",
  "Use the <b>Past Perfect</b> when <b>two things happened in the past</b>. The one that happened <b>first</b> gets <b>had + V3</b>.",

  ["tl2",22,"train left",40,"we reached"],
  ["tip","It is the <b>past of the past</b>. The action that happened <b>first</b> gets <b>had + V3</b>."]),
 learn("Making the Past Perfect",
  ["rules",["Positive","<sb>S</sb> + <vb>had</vb> + <ad>V3</ad> <i>She had left.</i>"],["Negative","<sb>S</sb> + <vb>had not</vb> + <ad>V3</ad> <i>She hadn't left.</i>"],["Question","<vb>Had</vb> + <sb>S</sb> + <ad>V3</ad>? <i>Had she left?</i>"]],
  "<b>had</b> is the same for every subject.",
  ["warn","I had went home before he came.","I had gone home before he came.","After had, use V3 (gone), not V2 (went)."],
  ["list","<b>Signal words</b>: before, after, by the time, already, just, until, when.","Use it only when there are <b>two past actions</b> or a past time to compare. One action alone is the Past Simple."]),

 mcq("She ___ the report before the manager asked for it.",["finished","has finished","had finished"],2,"She finished first, then the manager asked: had finished."),
 mcq("The teacher was angry because the students ___ their homework.",["hadn't done","haven't done","hasn't done"],0,"Not doing homework came first, in the past: hadn't + V3."),
 mcq("___ the class already begun when you entered?",["Had","Has","Did"],0,"“Already” + “when you entered” = Had + subject + V3."),

 build("She had not eaten anything.","had not + V3."),
 find("Tap the action that happened first.","After she [had eaten], she left.","“Had eaten” happened first.")

  "Compare: <b>now</b> → <i>have been waiting</i>. <b>Past</b> → <i>had been waiting</i>.",

],["<b>Past Perfect Continuous</b> = a long action before a past moment.","<b>had been + V-ing</b>.","It often gives the reason for a past situation.","now → have / has been · past → had been."]),

L("fw","Future with will","Decisions, promises, predictions",[
 learn("will: decisions, promises, predictions",
  "Use <b>will</b> when you decide <b>now</b>, make a <b>promise</b> or an offer, or give an <b>opinion or guess</b> about the future.",
  ["ex","The phone is ringing. I <vb>will</vb> answer it.|decision made now","I promise I <vb>will</vb> help you.|promise","I think it <vb>will</vb> rain tomorrow.|opinion"],
  ["tl",82,82,"Something that has not happened yet."],
  ["tip","<b>will</b> = decide now, promise, or guess. Words like <i>I think, maybe, probably, I promise</i> tell you to use will."]),
 learn("Making it",
  ["rules",["Positive","<sb>S</sb> + <vb>will</vb> + V1 <i>I will go.</i>"],["Negative","<sb>S</sb> + <vb>will not (won't)</vb> + V1 <i>I won't go.</i>"],["Question","<vb>Will</vb> + <sb>S</sb> + V1? <i>Will you go?</i>"]],
  "<b>will</b> is the same for every subject. Short form: I'll, she'll, they'll.",
  ["warn","She will goes.","She will go.","Modal + plain verb. No -s."],
  ["list","<b>Signal words</b>: tomorrow, next week, soon, I think, probably, maybe, I hope, I promise."],
  ["warn","If it will rain, we will stay home.","If it rains, we will stay home.","After <b>if, when, before, as soon as</b> use the PRESENT tense, not will."]),
 mcq("I think it ___ tomorrow.",["will rain","rains","is raining"],0,"“I think” + tomorrow = a prediction."),
 mcq("Don't worry. I ___ you.",["help","will help","helped"],1,"A promise or offer: will + V1."),
 mcq("I promise I ___ late again.",["won't be","don't be","wouldn't be"],0,"A promise: won't + V1."),
 mcq("___ you help me with this report, please?",["Do","Will","Are"],1,"A request: Will you ...?"),
 mcq("If it ___ tomorrow, we will stay home.",["will rain","rains","rained"],1,"After if, use the present tense."),
 mcq("Choose the correct sentence.",["She will comes tomorrow.","She will come tomorrow.","She will to come tomorrow."],1,"will + plain verb."),
 type("Make it negative. “I will go.” → I ___ go.",["won't","will not"],"will not = won't."),
 build("Will you call me tomorrow?","Will + subject + V1."),
 build("I will not be late.","will not + V1."),
 find("Tap the word that shows the future.","I [will] call you tomorrow.","“Will” shows the future.")
],["<b>will</b> = decision now, promise, offer, opinion, prediction.","<b>will + V1</b>. Negative: <b>won't</b>. Question: <b>Will + S + V1?</b>","No -s after will.","After if / when / before use the present, not will."]),

 mcq("Look at those dark clouds! It ___.",["will rain","is going to rain","rains"],1,"You can see proof now: going to."),
 mcq("I've decided. I ___ a new course next month.",["start","am going to start","will starting"],1,"A plan already decided: am going to."),
 mcq("The phone is ringing. I ___ answer it.",["am going to","will","go to"],1,"A decision made right now: will."),
 mcq("___ you going to join the training tomorrow?",["Do","Are","Will"],1,"Going to question: Are you going to ...?"),
 mcq("She ___ attend the meeting. She is on leave.",["isn't going to","won't going to","doesn't going to"],0,"Negative: is not going to."),

 build("What are you going to say?","Wh-word + are + subject + going to + V1."),

],["<b>going to</b> = plan or proof. <b>am / is / are going to + V1</b>.","<b>will</b> = decision now, promise, opinion.","Do not forget am / is / are.","“gonna” is for speaking only."]),

L("fc","Future Continuous","In progress at a future time",[

  ["tl",76,92,"At that future time, the action will be running."],

  ["rules",["Positive","<sb>S</sb> + <vb>will be</vb> + <ad>V-ing</ad> <i>I will be working.</i>"],["Negative","<sb>S</sb> + <vb>will not be</vb> + <ad>V-ing</ad> <i>I won't be working.</i>"],["Question","<vb>Will</vb> + <sb>S</sb> + <vb>be</vb> + <ad>V-ing</ad>? <i>Will you be working?</i>"]],
  ["list","<b>Signal words</b>: this time tomorrow, at 5 p.m. tomorrow, next Monday at 9, all day tomorrow."],
  ["warn","I will being work.","I will be working.","will + be + V-ing. Never “will being”."]),
 mcq("This time tomorrow, I ___ in the interview.",["will be sitting","sit","am sitting"],0,"A future moment with the action in progress."),
 mcq("Don't call me at 9 a.m. I ___ a class.",["will be taking","took","take"],0,"At 9 a.m. the class will be running."),
 mcq("At 5 p.m. tomorrow, we ___ to Chennai.",["will be travelling","travel","will travelled"],0,"will be + V-ing."),
 mcq("Tomorrow at this time, I ___ in the office. I'll be on leave.",["won't be working","don't work","wasn't working"],0,"Negative: won't be + V-ing."),
 mcq("___ you be using the projector at 3 p.m.?",["Will","Do","Are"],0,"Future continuous question: Will + subject + be + V-ing."),

],["<b>Future Continuous</b> = in progress at a future time.","<b>will be + V-ing</b>.","Signal words: this time tomorrow, at 5 p.m. tomorrow.","Polite question: Will you be using ...?"]),

L("fp","Future Perfect","Finished before a deadline",[

  "Use it for an action that will be <b>finished before a time in the future</b>.",
  ["ex","By next March, I <vb>will have completed</vb> my course.|a deadline","By 6 p.m. we <vb>will have finished</vb> the project.|done before 6","In 2030, Priya <vb>will have worked</vb> here for ten years.|counting up to a future point"],
  ["tl2",64,"finished",84,"deadline"],
  ["tip","Look for <b>by</b>: by Friday, by next month, by the time. The action will be done before then: <b>will have + V3</b>."]),
 learn("Making it",
  ["rules",["Positive","<sb>S</sb> + <vb>will have</vb> + <ad>V3</ad> <i>I will have finished.</i>"],["Negative","<sb>S</sb> + <vb>will not have</vb> + <ad>V3</ad> <i>I won't have finished.</i>"],["Question","<vb>Will</vb> + <sb>S</sb> + <vb>have</vb> + <ad>V3</ad>? <i>Will you have finished?</i>"]],
  ["list","<b>Signal words</b>: by tomorrow, by next month, by the time, by 2030, before."],
  ["warn","By next month I will complete the course.","By next month I will have completed the course.","“By + future time” = will have + V3."],
  ["warn","I will have went there.","I will have gone there.","After will have, use V3."]),
 mcq("By next March, I ___ my course.",["will complete","will have completed","complete"],1,"A deadline (by March): will have + V3."),

],["<b>Future Perfect</b> = finished before a future time.","<b>will have + V3</b>.","Signal words: by tomorrow, by next month, by the time.","Negative: won't have + V3."]),

L("fpc","Future Perfect Continuous","A rare tense, for how long",[

  "This tense is <b>rare</b>. Use it to say <b>how long</b> something will have been going on <b>at a future time</b>.",

  ["rules",["Positive","<sb>S</sb> + <vb>will have been</vb> + <ad>V-ing</ad>"],["Negative","<sb>S</sb> + <vb>will not have been</vb> + <ad>V-ing</ad>"],["Question","<vb>Will</vb> + <sb>S</sb> + <vb>have been</vb> + <ad>V-ing</ad>?"]],
  ["tip","Future Perfect = finished by then. Future Perfect Continuous = <b>how long</b> it will have been going on by then."]),

 mcq("The sun ___ in the east.",["rises","is rising","rose"],0,"A fact: Present Simple."),

 mcq("Dark clouds! It ___ rain.",["will","is going to","rains"],1,"Proof you can see now: going to."),
 mcq("By next year, I ___ my degree.",["will complete","will have completed","complete"],1,"“By next year” = a deadline: Future Perfect."),
 mcq("He ___ here since 2022.",["works","has worked","worked"],1,"“Since 2022” = starting point, still true: Present Perfect."),
 type("They ___ cricket every Sunday. (play)","play","“Every Sunday” = a habit. They + V1: play."),
 type("She ___ to Chennai last year. (move)","moved","“Last year” = finished time: Past Simple."),

],["Past Simple = finished time. Present Perfect = connected to now.","Present Simple = habit. Present Continuous = now.","Past Simple = finished. Past Continuous = in progress.","will = decide now. going to = plan or proof.","for + length. since + starting point."])

<script>
with(H){

MOD("m5","5. More basics you need","Everyday grammar that scholars use at work and in tests.",[

L("count","Countable and uncountable","some, any, much, many",[
 learn("Can you count it?",
  "<b>Countable nouns</b> can be counted: one pen, two pens. <b>Uncountable nouns</b> cannot be counted one by one: water, rice, information, advice, furniture, money, news, homework.",
  ["table",["Countable","Uncountable"],["a book, two books","water, rice"],["a chair, three chairs","furniture, money"],["an idea, many ideas","information, advice, news"]],
  ["warn","She gave me many advices.","She gave me a lot of advice.","Advice is uncountable. It has no plural and no “a”."],
  ["warn","The news are good.","The news is good.","Uncountable nouns take a singular verb."],
  ["tip","To count an uncountable noun, use a unit: <i>a piece of advice, a glass of water, a cup of tea, a bag of rice</i>."]),
 learn("many, much, a lot of, some, any",
  ["table",["Word","Use with","Example"],["many","countable, mostly in questions and negatives","How many students are there?"],["much","uncountable, mostly in questions and negatives","I don't have much time."],["a lot of","both, in positive sentences","She has a lot of friends. We have a lot of work."],["some","positive sentences and offers","I have some questions. Would you like some tea?"],["any","questions and negatives","Do you have any questions? I don't have any money."],["a few / few","countable: a few = some, few = almost none","I have a few friends."],["a little / little","uncountable: a little = some, little = almost none","I have a little time."]]),
 mcq("Which noun is uncountable?",["chair","advice","book"],1,"You cannot say “one advice, two advices”. Advice is uncountable."),
 mcq("How ___ water do you drink?",["many","much","few"],1,"Water is uncountable: much."),
 mcq("How ___ students are in your batch?",["many","much","little"],0,"Students can be counted: many."),
 mcq("I don't have ___ time.",["many","much","a few"],1,"Time is uncountable, and the sentence is negative: much."),
 mcq("The news ___ good.",["is","are"],0,"News is uncountable, so it takes “is”."),
 mcq("Do you have ___ questions?",["some","any","much"],1,"A question: any."),
 mcq("I need ___ advice.",["an","some","many"],1,"Advice is uncountable. Use some, not a / an."),
 sort("Countable or uncountable?",["Countable","Uncountable"],[["pen",0],["water",1],["information",1],["laptop",0],["furniture",1],["idea",0],["homework",1],["student",0]],"If you can say “one ___, two ___”, it is countable.")
],["<b>Countable</b>: one, two ... <b>Uncountable</b>: water, advice, information, news, furniture, homework.","<b>many</b> + countable · <b>much</b> + uncountable · <b>a lot of</b> + both.","<b>some</b> in positive sentences · <b>any</b> in questions and negatives.","<b>a few / a little</b> = some · <b>few / little</b> = almost none."]),

L("compare","Comparing things","bigger, biggest, as ... as",[
 learn("Comparative and superlative",
  "Use the <b>comparative</b> to compare two things. Use the <b>superlative</b> for the top one in a group.",
  ["table",["Adjective","Comparative (two)","Superlative (top)"],["tall (short word)","taller","the tallest"],["big (double the letter)","bigger","the biggest"],["happy (y → i)","happier","the happiest"],["beautiful (long word)","more beautiful","the most beautiful"],["good (irregular)","better","the best"],["bad (irregular)","worse","the worst"]],
  ["rules",["Short words","adjective + <b>er</b> / the + adjective + <b>est</b>"],["Long words","<b>more</b> + adjective / <b>the most</b> + adjective"]],
  "Use <b>than</b> after a comparative: <i>Ravi is taller than Kumar.</i> Use <b>the</b> before a superlative: <i>He is the tallest in the class.</i>",
  ["warn","She is more taller than me.","She is taller than me.","Never use more and -er together."]),
 learn("as ... as",
  "Use <b>as + adjective + as</b> when two things are equal: <i>Priya is as tall as Meena.</i> Use <b>not as ... as</b> when one is less: <i>This test is not as difficult as that one.</i>"),
 mcq("My bag is ___ than yours.",["heavy","heavier","heaviest"],1,"Two things, short word, y becomes i: heavier."),
 mcq("This is ___ book I have ever read.",["good","better","the best"],2,"The top of all: the best."),
 mcq("English is ___ than Maths for me.",["more easy","easier","most easy"],1,"Short word: easier."),
 mcq("She is ___ girl in the class.",["the most intelligent","more intelligent","intelligenter"],0,"Long word, top of the group: the most intelligent."),
 mcq("Choose the correct sentence.",["He is more smarter than me.","He is smarter than me.","He is smart than me."],1,"Use -er, and never more together with it."),
 type("Ravi is ___ than Kumar. (tall)","taller","Short word: tall + er."),
 type("This is the ___ day of my life. (good)","best","good → better → best."),
 build("She is as tall as her sister.","as + adjective + as."),
 sort("-er / -est or more / most?",["-er / -est","more / most"],[["fast",0],["expensive",1],["small",0],["interesting",1],["old",0],["comfortable",1]],"Short words take -er / -est. Long words take more / most.")
],["Two things: <b>-er / more ... than</b>. The top: <b>the -est / the most</b>.","Irregular: good → better → best · bad → worse → worst.","Never use <b>more</b> and <b>-er</b> together.","<b>as ... as</b> = equal."]),

L("if","If sentences","Conditionals",[
 learn("Zero and first conditional",
  "A <b>conditional</b> sentence has an <b>if</b> part (the condition) and a result part.",
  ["table",["Type","Meaning","Pattern","Example"],["Zero","always true","if + present, present","If you heat ice, it melts."],["First","real, possible future","if + present, <b>will</b> + V1","If it rains, we will stay home."]],
  ["warn","If it will rain, we will stay home.","If it rains, we will stay home.","Never use will in the if part."],
  ["tip","Put a comma when the if part comes first. No comma when it comes second: <i>We will stay home if it rains.</i>"]),
 learn("Second and third conditional",
  ["table",["Type","Meaning","Pattern","Example"],["Second","unreal or unlikely now","if + past, <b>would</b> + V1","If I had time, I would learn French."],["Third","past, cannot change","if + past perfect, would have + V3","If I had studied, I would have passed."]],
  "In the second conditional we use <b>were</b> for all subjects: <i>If I were you, I would apply.</i>",
  ["tip","Second = dream or advice. Third = regret."]),
 mcq("If you ___ hard, you will pass.",["study","will study","studied"],0,"First conditional: if + present."),
 mcq("If it ___ tomorrow, we will cancel the trip.",["will rain","rains","rained"],1,"After if, use the present simple."),
 mcq("If I ___ a bird, I would fly to you.",["am","were","will be"],1,"Second conditional: were."),
 mcq("If I had more time, I ___ learn French.",["will","would","had"],1,"Second conditional result: would + V1."),
 mcq("If she had left earlier, she ___ the train.",["would catch","would have caught","will catch"],1,"Third conditional (past regret): would have + V3."),
 mcq("If you heat water to 100°C, it ___.",["boils","will boil","boiled"],0,"A fact (zero conditional): present + present."),
 build("If it rains, we will stay home.","if + present, will + V1."),
 sort("Which conditional is it?",["First (possible)","Second (dream)","Third (regret)"],[["If I win, I will celebrate.",0],["If I were rich, I would travel.",1],["If I had known, I would have helped.",2]],"Possible future = first. Unreal now = second. Past regret = third.")
],["Zero: if + present, present (facts).","First: if + present, <b>will</b> + V1.","Second: if + past, <b>would</b> + V1 (were for all subjects).","Third: if + had + V3, would have + V3.","Never use will in the if part."]),

L("passive","Active and passive","Who does it, and who receives it",[
 learn("Active and passive",
  "In an <b>active</b> sentence, the subject does the action: <i>Ravi wrote the report.</i> In a <b>passive</b> sentence, the subject receives the action: <i>The report was written by Ravi.</i>",
  ["rules",["Passive","<sb>object</sb> + <vb>be</vb> + <ad>V3</ad> (+ by the doer)"]],
  "The <b>be</b> verb takes the tense. The main verb is always <b>V3</b>.",
  ["table",["Tense","Active","Passive"],["Present Simple","They make tea.","Tea is made."],["Past Simple","They made tea.","Tea was made."],["Present Perfect","They have made tea.","Tea has been made."],["Future","They will make tea.","Tea will be made."],["Modal","They can make tea.","Tea can be made."]],
  ["tip","Use the passive when the doer is not important or not known: <i>My phone was stolen.</i>"]),
 mcq("The report ___ by Ravi yesterday.",["wrote","was written","is written"],1,"Passive, past: was + V3."),
 mcq("English ___ all over the world.",["speaks","is spoken","spoke"],1,"Passive, present: is + V3."),
 mcq("The work ___ finished already.",["has been","was being","will be"],0,"Passive, present perfect: has been + V3. “Already” shows it is done now."),
 mcq("The work ___ tomorrow.",["will finish","will be finished","will finished"],1,"Passive, future: will be + V3."),
 type("Make it passive: “They built the bridge.” → The bridge ___ built.","was","Past passive: was + V3.","Past tense of be"),
 mcq("Which sentence is passive?",["She wrote a letter.","A letter was written.","She is writing a letter."],1,"The subject (a letter) receives the action: was written."),
 sort("Active or passive?",["Active","Passive"],[["The chef cooked dinner.",0],["Dinner was cooked by the chef.",1],["The manager signed the form.",0],["The form was signed.",1]],"Passive = be + V3.")
],["Passive: <b>be + V3</b>. The <b>be</b> verb shows the tense.","Use the passive when the doer is unknown or not important.","Active: Ravi wrote it. Passive: It was written (by Ravi)."]),

L("report","Reported speech","What someone said",[
 learn("Telling what someone said",
  "<b>Direct speech</b> gives the exact words: <i>She said, “I am tired.”</i> <b>Reported speech</b> tells the idea: <i>She said that she was tired.</i> The tense usually moves <b>one step back</b>.",
  ["table",["Direct","Reported"],["am / is / are","was / were"],["Present Simple (works)","Past Simple (worked)"],["Present Continuous (is working)","Past Continuous (was working)"],["Present Perfect (has worked)","Past Perfect (had worked)"],["Past Simple (worked)","Past Perfect (had worked)"],["will","would"],["can","could"]],
  "Pronouns and time words also change: <i>I → he / she</i> · <i>now → then</i> · <i>today → that day</i> · <i>tomorrow → the next day</i> · <i>yesterday → the day before</i> · <i>here → there</i>.",
  ["ex","He said, “I will call you tomorrow.” → He said that he <vb>would</vb> call me <tm>the next day</tm>.|will becomes would, tomorrow becomes the next day"]),
 learn("Reported questions",
  "Reported questions use <b>statement order</b>. There is no do / does / did, and no question mark.",
  ["ex","She asked, “Where do you live?” → She asked me where I <vb>lived</vb>.|no “do”","He asked, “Are you ready?” → He asked if I <vb>was</vb> ready.|yes/no question → if / whether"]),
 mcq("She said, “I am tired.” → She said that she ___ tired.",["is","was","has been"],1,"am / is becomes was."),
 mcq("He said, “I will call you.” → He said that he ___ call me.",["will","would","can"],1,"will becomes would."),
 mcq("She said, “I work in Madurai.” → She said she ___ in Madurai.",["works","worked","had work"],1,"Present Simple becomes Past Simple."),
 mcq("He asked, “Where do you live?” → He asked me where I ___.",["do live","lived","did live"],1,"No do / did in reported questions: lived."),
 mcq("He said, “I am coming tomorrow.” → He said he was coming ___.",["tomorrow","the next day","yesterday"],1,"tomorrow becomes the next day."),
 mcq("She asked, “Are you ready?” → She asked ___ I was ready.",["if","that","what"],0,"A yes/no question: if or whether."),
 match("Match the direct word with the reported word.",[["now","then"],["today","that day"],["tomorrow","the next day"],["here","there"]],"Time and place words move away from the speaker.")
],["Reported speech: the tense moves <b>one step back</b> (am → was, will → would, can → could).","Pronouns and time words change: I → he, tomorrow → the next day.","Reported questions: <b>statement order</b>, no do / did, use if / whether."]),

L("sva","Subject and verb agreement","Make them match",[
 learn("The golden rule",
  "A <b>singular</b> subject takes a <b>singular</b> verb. A <b>plural</b> subject takes a <b>plural</b> verb.",
  ["list","<b>One person or thing</b>: <i>The boy plays. The bus stops.</i>","<b>More than one</b>: <i>The boys play. The buses stop.</i>","<b>Two subjects joined by “and”</b>: <i>Ravi and Priya are here.</i> (plural)","<b>each, every, everyone, nobody, someone</b>: <i>Each student has a book. Everyone is here.</i> (singular)","<b>One of the ...</b> takes a singular verb: <i>One of my friends is a doctor.</i>","<b>The number of</b> takes a singular verb. <b>A number of</b> takes a plural verb.","Ignore extra words between subject and verb: <i>The box of apples is heavy.</i> (the box is heavy)"]),
 learn("Tricky cases",
  ["list","<b>Neither ... nor / either ... or</b>: the verb agrees with the nearer subject: <i>Neither Ravi nor his friends are here.</i>","<b>Subjects with “with” or “along with”</b>: the first subject decides: <i>The teacher, with her students, is arriving.</i>","<b>Nouns that look plural but are singular</b>: news, mathematics, physics, economics: <i>Mathematics is hard.</i>","<b>Plural-only nouns</b>: scissors, trousers, glasses: <i>My trousers are new.</i>"]),
 mcq("Each of the students ___ a book.",["have","has"],1,"Each is singular: has."),
 mcq("The box of apples ___ heavy.",["is","are"],0,"The subject is the box (one): is."),
 mcq("Ravi and Priya ___ my friends.",["is","are"],1,"Two people joined by and: are."),
 mcq("Neither the teacher nor the students ___ here.",["is","are"],1,"The verb agrees with the nearer subject: students (plural)."),
 mcq("One of my friends ___ a doctor.",["is","are"],0,"“One of” takes a singular verb: is."),
 mcq("Mathematics ___ difficult for me.",["is","are"],0,"Mathematics is singular, even though it ends in s."),
 mcq("My trousers ___ new.",["is","are"],1,"Trousers is plural."),
 mcq("Everybody ___ ready.",["is","are"],0,"Everybody is singular.")
],["Singular subject → singular verb. Plural subject → plural verb.","<b>Each, every, everyone, nobody</b> and <b>one of</b> are singular.","Ignore the words between the subject and the verb.","Neither / either: agree with the nearer subject."]),

L("tags","Question tags and short answers","isn't it? don't you?",[
 learn("Question tags",
  "A <b>question tag</b> is a short question at the end of a sentence. Use it to check something or to invite agreement.",
  ["rules",["Positive → negative tag","<i>You are ready, <b>aren't you</b>?</i>"],["Negative → positive tag","<i>You aren't ready, <b>are you</b>?</i>"]],
  ["table",["Sentence","Tag"],["She works here,","doesn't she?"],["They went home,","didn't they?"],["He can swim,","can't he?"],["You haven't finished,","have you?"],["I am right,","aren't I?"],["Let's go,","shall we?"]],
  "The tag uses the same helping verb as the sentence. If there is no helper in the Present Simple or Past Simple, use do / does / did."),
 learn("Short answers",
  "To answer yes/no questions in a natural way, repeat the helper: <i>Are you ready? Yes, I am. / No, I'm not.</i> <i>Does she like tea? Yes, she does. / No, she doesn't.</i> <i>Can he swim? Yes, he can. / No, he can't.</i>"),
 mcq("She works here, ___?",["doesn't she","isn't she","does she"],0,"A positive sentence takes a negative tag. Present Simple: doesn't she."),
 mcq("They went home, ___?",["didn't they","don't they","did they"],0,"Past Simple: didn't they."),
 mcq("You haven't finished, ___?",["haven't you","have you","did you"],1,"A negative sentence takes a positive tag: have you."),
 mcq("He can swim, ___?",["can't he","doesn't he","isn't he"],0,"Same helper as the sentence: can't he."),
 mcq("Does she like tea? Yes, she ___.",["likes","does","is"],1,"A short answer repeats the helper: does."),
 mcq("Are you a trainer? No, I ___.",["don't","am not","not"],1,"Short answer: No, I'm not."),
 type("It's a nice day, ___ it?","isn't","is + not = isn't it?")
],["Positive sentence → <b>negative tag</b>. Negative sentence → <b>positive tag</b>.","The tag uses the same helper. No helper? Use do / does / did.","Short answers repeat the helper: Yes, she does."]),

L("gerund","-ing form or to + verb?","enjoy doing, want to do",[
